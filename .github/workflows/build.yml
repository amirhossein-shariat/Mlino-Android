name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test --no-daemon --console=plain 2>&1 | tee core.log; test ${PIPESTATUS[0]} -eq 0
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee app.log; test ${PIPESTATUS[0]} -eq 0
      - name: Error summary
        if: failure()
        run: grep -hE "^e: |error:|What went wrong|FAILED|Execution failed|> " core.log app.log 2>/dev/null | grep -v "^> Task" | awk '!seen[$0]++' | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: mlino-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/**
