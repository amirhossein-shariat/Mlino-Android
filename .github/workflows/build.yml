name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: |
          set -o pipefail
          ./gradlew :core:test --no-daemon --console=plain 2>&1 | tee core.log
      - name: Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee app.log
      - name: Release APK (R8 + resource shrinking, unsigned)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --console=plain 2>&1 | tee release.log
      - name: Error summary
        if: failure()
        run: |
          cat core.log app.log release.log 2>/dev/null | grep -E -A4 '^e: |What went wrong' | grep -v 'AndroidX dependencies' | grep -v 'debugRuntimeClasspath' | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: malino-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish the APK on the builds branch
        if: success()
        run: |
          set -e
          mkdir /tmp/out && cp app/build/outputs/apk/debug/*.apk /tmp/out/malino-debug.apk
          cp app/build/outputs/apk/release/*.apk /tmp/out/malino-release-unsigned.apk
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add malino-debug.apk malino-release-unsigned.apk
          git commit -q -m "malino-debug.apk from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/**
