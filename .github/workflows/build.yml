name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: |
          set -o pipefail
          ./gradlew :core:test --no-daemon --console=plain 2>&1 | tee core.log
      - name: Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee app.log
      - name: Error summary
        if: failure()
        run: |
          cat core.log app.log 2>/dev/null | grep -E -A4 '^e: |What went wrong' | grep -v 'AndroidX dependencies' | grep -v 'debugRuntimeClasspath' | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: mlino-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/**
